name: qfc-step4-stability

on:
  workflow_dispatch:

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.1,<2.7" "transformers==4.51.3" "datasets>=2.20,<4" "accelerate>=0.34"
          pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Run three-split QFC stability experiment
        run: |
          python scripts/step4_split_stability.py \
            --model-id textattack/bert-base-uncased-SST-2 \
            --offsets 0,96,192 \
            --calibration-size 32 \
            --evaluation-size 32 \
            --heads-to-keep 9 \
            --batch-size 4 \
            --max-length 32 \
            --output-dir results/step4_stability
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qfc-step4-stability
          path: results/step4_stability/
