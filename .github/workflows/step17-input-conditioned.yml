name: qfc-step17-input-conditioned

on:
  push:
    branches: ["research/qfc-v9-input-conditioned"]
  workflow_dispatch:

jobs:
  input-conditioned:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu"
          pip install "transformers==4.51.3" "datasets>=2.20,<4" "accelerate>=0.34" "numpy>=1.26,<3"
          pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Run input-conditioned smoke
        run: |
          python scripts/step17_input_conditioned.py             --calibration-size 128             --calibration-seed 42             --evaluation-size 64             --heads-to-keep 6             --batch-size 8             --max-length 64             --bootstrap 500             --output-dir results/step17_input_conditioned
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qfc-step17-input-conditioned
          path: results/step17_input_conditioned/
