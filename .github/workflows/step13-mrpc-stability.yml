name: qfc-step13-mrpc-stability

on:
  push:
    branches: ["research/qfc-v5-mrpc-stability"]
  workflow_dispatch:

jobs:
  mrpc-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu"
          pip install "transformers==4.51.3" "datasets>=2.20,<4" "accelerate>=0.34" "numpy>=1.26,<3"
          pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Run MRPC stability study
        run: |
          python scripts/step13_mrpc_stability.py             --model-id textattack/bert-base-uncased-MRPC             --model-revision ddeddf4a04cd7b9415b00e40b00e78f0c61a7921             --calibration-size 128             --evaluation-size -1             --heads-to-keep 6             --seeds 7,42,77             --batch-size 16             --max-length 128             --bootstrap 1000             --output-dir results/step13_mrpc_stability
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qfc-step13-mrpc-stability
          path: results/step13_mrpc_stability/
