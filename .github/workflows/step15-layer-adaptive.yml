name: qfc-step15-layer-adaptive-smoke

on:
  push:
    branches: ["research/qfc-v7-layer-adaptive"]
  workflow_dispatch:

jobs:
  layer-adaptive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu"
          pip install "transformers==4.51.3" "datasets>=2.20,<4" "accelerate>=0.34" "numpy>=1.26,<3"
          pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Run layer-adaptive smoke
        run: |
          python scripts/step15_layer_adaptive_smoke.py             --calibration-size 32             --calibration-seed 42             --evaluation-size 64             --heads-to-keep 6             --batch-size 8             --max-length 64             --bootstrap 300             --output-dir results/step15_layer_adaptive_smoke
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qfc-step15-layer-adaptive-smoke
          path: results/step15_layer_adaptive_smoke/
