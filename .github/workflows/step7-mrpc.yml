name: qfc-step7-mrpc-smoke

on:
  workflow_dispatch:

jobs:
  mrpc-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu"
          pip install "transformers==4.51.3" "datasets>=2.20,<4" "accelerate>=0.34"
          pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Run MRPC smoke
        run: |
          python scripts/step7_mrpc_smoke.py \
            --model-id textattack/bert-base-uncased-MRPC \
            --calibration-size 16 \
            --evaluation-size 32 \
            --heads-to-keep 9 \
            --batch-size 4 \
            --max-length 64 \
            --bootstrap 500 \
            --output-dir results/step7_mrpc_smoke
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qfc-step7-mrpc
          path: results/step7_mrpc_smoke/
