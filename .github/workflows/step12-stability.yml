name: qfc-step12-stability-smoke

on:
  push:
    branches: ["research/qfc-v4"]
  workflow_dispatch:

jobs:
  stability-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu"
          pip install "transformers==4.51.3" "datasets>=2.20,<4" "accelerate>=0.34" "numpy>=1.26,<3"
          pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Run stability smoke
        run: |
          python scripts/step12_qfc_stability.py \
            --model-id textattack/bert-base-uncased-SST-2 \
            --model-revision 205ffbd1bc5c5b89802266f4948a601f53556b00 \
            --calibration-size 32 \
            --evaluation-size 64 \
            --heads-to-keep 6 \
            --seeds 7,42,77 \
            --batch-size 8 \
            --max-length 32 \
            --bootstrap 300 \
            --output-dir results/step12_qfc_stability
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qfc-step12-stability
          path: results/step12_qfc_stability/
