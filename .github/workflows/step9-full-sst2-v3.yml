name: qfc-step9-full-sst2-v3

on:
  workflow_dispatch:

jobs:
  full-sst2-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0+cpu"
          pip install "transformers==4.51.3" "datasets>=2.20,<4" "accelerate>=0.34" "numpy>=1.26,<3"
          pip install -e . --no-deps
      - name: Compile
        run: python -m compileall -q src scripts
      - name: Full SST-2 v3
        run: |
          python scripts/step5_full_sst2_budget_sweep.py \
            --model-id textattack/bert-base-uncased-SST-2 \
            --model-revision 205ffbd1bc5c5b89802266f4948a601f53556b00 \
            --calibration-size 256 \
            --heads-to-keep 10,9,8,6 \
            --batch-size 32 \
            --max-length 128 \
            --seed 42 \
            --bootstrap 1000 \
            --random-replicates 3 \
            --output-dir results/step9_full_sst2_v3
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qfc-step9-full-sst2-v3
          path: results/step9_full_sst2_v3/
