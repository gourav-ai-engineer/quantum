[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-attention-pruning"
version = "0.1.0"
description = "Research implementation of quantum-fidelity coverage for Transformer attention-head pruning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.1,<2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]
transformers = ["transformers>=4.45", "datasets>=2.20", "accelerate>=0.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
